
name: Build ZettaBridge ARM64 APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish an installable APK to GitHub Releases after successful checks"
        type: boolean
        required: true
        default: true

permissions:
  contents: write

concurrency:
  group: zettabridge-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      NDK_HOST: linux-x86_64

    steps:
      - name: Checkout with Dynarmic submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build python3 curl unzip e2fsprogs libboost-dev openjdk-17-jdk

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Install pinned SDK and NDK
        run: |
          # The ubuntu-24.04 image ships the Android SDK with cmdline-tools/latest.
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;29.0.14206865'
          NDK="$ANDROID_HOME/ndk/29.0.14206865"
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          test -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" || {
            echo 'NDK r29 linux-x86_64 toolchain unavailable.'
            exit 1
          }

      - name: Apply upstream Dynarmic patches
        run: |
          git -C third_party/dynarmic apply --check ../patches/dynarmic-0001-thumb32-armv8.patch ../patches/dynarmic-0002-asimd-narrowing.patch
          git -C third_party/dynarmic apply ../patches/dynarmic-0001-thumb32-armv8.patch ../patches/dynarmic-0002-asimd-narrowing.patch

      - name: Obtain ARM32 Android sysroot
        run: sh tools/extract_sysroot.sh

      - name: Generate ARM32 guest host-call stubs
        run: python3 tools/gen_stubs.py

      - name: Compile ARM32 guest libraries
        run: sh tools/build_guest.sh

      - name: Configure and compile ARM64 translator
        run: |
          mkdir -p build/boost-headers
          ln -sfn /usr/include/boost build/boost-headers/boost
          cmake -S . -B build/android-arm64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DZB_BUILD_TESTS=OFF \
            -DBoost_INCLUDE_DIR="$GITHUB_WORKSPACE/build/boost-headers"

          ninja -C build/android-arm64 zbridge

          test -f build/android-arm64/core/libzbridge.so
          test -f build/android-arm64/core/libzbproxy.so

      - name: Assemble and validate launcher runtime bundle
        run: sh tools/make_launcher_bundle.sh

      - name: Build installable debug APK
        working-directory: android/launcher
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Audit actual APK GLES1 packaging
        run: |
          APK="$(find android/launcher/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          python3 tools/check_launcher_apk.py "$APK"

          mkdir -p dist
          cp "$APK" dist/ZettaBridge-PocketArmy-test.apk
          sha256sum dist/ZettaBridge-PocketArmy-test.apk > dist/SHA256SUMS.txt

      - name: Publish unique test Release
        if: ${{ inputs.publish_release && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="pocketarmy-test-${GITHUB_RUN_NUMBER}"

          gh release create "$TAG" \
            dist/ZettaBridge-PocketArmy-test.apk \
            dist/SHA256SUMS.txt \
            --title "ZettaBridge Pocket Army test #${GITHUB_RUN_NUMBER}" \
            --notes "Experimental debug-signed APK for testing GLES1 loading. Packaging audit passed; Pocket Army compatibility is not confirmed." \
            --prerelease \
            --target "$GITHUB_SHA"
            
